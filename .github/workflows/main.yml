name: Generate Podcasts XML
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v3
      - name: Setup python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: run feed generator
        run: python feed.py
      - name: push repo
        run: |
          git config user.name github-actions-by-bala
          git config user.email github-actions-by-bala@github.com
          git add .
          git commit -m "updated feed by ga actions"
          git push
        
        
